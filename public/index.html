<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="The minimalist local player that turns anime into your Anki deck."
    />
    <title>zehntage-reactor</title>

    <!-- PWA: installable + offline-capable app shell -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="zehntage" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // No-flash theme bootstrap: apply the persisted theme before the app
      // bundle (and thus the first paint) loads.
      try {
        var t = localStorage.getItem("zr.theme");
        if (t === "light" || t === "dark" || t === "system") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
